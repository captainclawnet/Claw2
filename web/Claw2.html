            if (stopped || comparison()) return;

                disable_session_recording: true, disable_surveys: true,

<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {

// Keep startup working if an older cached deployment config has only the asset URL.
const clawScreenWidth = 640;
const clawScreenHeight = 480;

    const root = document.documentElement;
    const width = Math.max(1, root.clientWidth || innerWidth);
    const height = Math.max(1, root.clientHeight || innerHeight);
    const rotated = height > width;
    root.classList.toggle('claw-rotated', rotated);
    // Fit the fixed 4:3 game view to the largest rectangle available. In
    // portrait, fit it to the viewport after accounting for its 90° rotation.
    const orientedWidth = rotated ? height : width;
    const orientedHeight = rotated ? width : height;
    const scale = Math.min(orientedWidth / clawScreenWidth, orientedHeight / clawScreenHeight);
    root.style.setProperty('--game-view-width', (clawScreenWidth * scale) + 'px');
    root.style.setProperty('--game-view-height', (clawScreenHeight * scale) + 'px');

clawUpdateLayout();
for (const id of ['canvas', 'loading']) {
    document.getElementById(id).width = clawScreenWidth;
    document.getElementById(id).height = clawScreenHeight;
