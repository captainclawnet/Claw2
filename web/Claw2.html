<!doctype html>
<html lang="en">

<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#10151d;color:#eee;font:16px system-ui;text-align:center}
body.touch-controls-visible,#canvas.touch-controls-visible{cursor:none!important}
#game{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden}
canvas{display:block;outline:none;background:#000}

#loading{pointer-events:none;background:transparent}
html.claw-rotated #game{position:fixed;inset:0;width:100vw;height:100dvh;display:block;transform:none}
html.claw-rotated #canvas,html.claw-rotated #loading{width:var(--game-view-width,100dvh)!important;height:var(--game-view-height,100vw)!important;transform:translate(-50%,-50%) rotate(90deg)}
#loading[hidden]{display:none}
#touch-controls[hidden]{display:none}
#touch-controls{position:fixed;inset:0;pointer-events:none;z-index:10;user-select:none;-webkit-user-select:none}
.touch-pad,.touch-actions,.touch-menu{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));pointer-events:auto;touch-action:none}
.touch-pad[hidden],.touch-actions button[hidden]{display:none}
.touch-pad{left:max(16px,env(safe-area-inset-left));display:grid;grid-template-columns:repeat(3,clamp(36px,9vw,60px));grid-template-rows:repeat(3,clamp(36px,9vw,60px));grid-template-areas:". up ." "left . right" ". down ."}
.touch-actions{right:max(16px,env(safe-area-inset-right));display:grid;grid-template-columns:repeat(2,auto);gap:8px}
.touch-menu{top:max(16px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));bottom:auto}
#touch-controls button{margin:0;padding:0;width:clamp(36px,9vw,60px);height:clamp(36px,9vw,60px);border:1px solid #ffffff80;border-radius:12px;background:#172536aa;color:white;font:bold 14px system-ui;touch-action:none}

#touch-controls button.active{background:#d09535dd;border-color:#ffe1a3}
.touch-pad span{pointer-events:none}
html.claw-rotated #touch-controls{inset:auto;width:100dvh;height:100vw;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg)}
html.claw-rotated .touch-pad,html.claw-rotated .touch-actions,html.claw-rotated .touch-menu{position:absolute}
html.claw-rotated .touch-pad,html.claw-rotated .touch-actions{bottom:max(16px,env(safe-area-inset-bottom));top:auto}
html.claw-rotated .touch-menu{top:max(16px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left))}
html.claw-rotated .touch-pad{left:max(16px,env(safe-area-inset-left))}
html.claw-rotated .touch-actions{right:max(16px,env(safe-area-inset-right))}
#touch-controls button[hidden]{display:none}
#touch-controls .touch-stick{position:absolute;left:20px;bottom:20px;width:150px;height:150px;border-radius:50%;font-size:48px;pointer-events:auto;touch-action:none;background:radial-gradient(circle,#ffffff60 0 22%,#172536aa 24%)}
#touch-controls .touch-keyboard{position:absolute;top:max(16px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right));pointer-events:auto;font-size:26px}
#touch-controls .touch-menu button{font-size:26px}
.touch-text-input{position:absolute;top:0;left:50%;width:1px;height:1px;padding:0;border:0;opacity:0;pointer-events:none;font-size:16px}

#leaderboard-title{margin:0;color:#ffe1a3}

#leaderboard-status{min-height:1.5em}

#leaderboard-entries li span,#leaderboard-entries li small{display:block;margin-top:5px}

</style>
