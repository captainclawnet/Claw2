<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claw 2 — Web</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#10151d;color:#eee;font:16px system-ui;text-align:center}
body.touch-controls-visible,#canvas.touch-controls-visible{cursor:none!important}
#game{position:relative;margin:auto;width:100vw;height:100dvh;display:grid;place-items:center}
canvas{display:block;width:100%;height:100%;outline:none;background:#000}
#canvas,#loading{position:absolute;width:var(--game-width,100vw);height:var(--game-height,100dvh);left:50%;top:50%;transform:translate(-50%,-50%)}
#loading{object-fit:fill;background:transparent;pointer-events:none}
@media (orientation:portrait) and (pointer:coarse){#game{width:100dvh;height:100vw;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg)}#canvas,#loading{width:100dvh;height:100vw;left:50%;top:50%}.touch-pad,.touch-actions{transform:rotate(-90deg);transform-origin:center}}
#loading[hidden]{display:none}
#touch-controls[hidden]{display:none}
#touch-controls{position:fixed;inset:0;pointer-events:none;z-index:10;user-select:none;-webkit-user-select:none}
.touch-pad,.touch-actions{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));pointer-events:auto;touch-action:none}
.touch-pad[hidden],.touch-actions button[hidden]{display:none}
.touch-pad{left:max(16px,env(safe-area-inset-left));display:grid;grid-template-columns:repeat(3,clamp(36px,9vw,60px));grid-template-rows:repeat(3,clamp(36px,9vw,60px));grid-template-areas:". up ." "left . right" ". down ."}
.touch-actions{right:max(16px,env(safe-area-inset-right));display:grid;grid-template-columns:repeat(2,auto);gap:8px}
#touch-controls button{margin:0;padding:0;width:clamp(36px,9vw,60px);height:clamp(36px,9vw,60px);border:1px solid #ffffff80;border-radius:12px;background:#172536aa;color:white;font:bold 14px system-ui;touch-action:none}
#touch-controls .touch-actions button{width:clamp(54px,12vw,80px);height:clamp(54px,12vw,80px);border-radius:50%;font-size:12px}
#touch-controls button.active{background:#d09535dd;border-color:#ffe1a3}
.touch-pad span{pointer-events:none}
</style>
<div id="game">
<canvas id="canvas" width="960" height="540" tabindex="0" aria-label="Claw 2" oncontextmenu="event.preventDefault()"></canvas>
<canvas id="loading" width="960" height="540" role="status" aria-live="polite"></canvas>
</div>
<script src="claw-config.js"></script>
<script>
function clawMeasureViewport() {
    let width = Math.max(320, Math.floor(innerWidth));
    let height = Math.max(180, Math.floor(innerHeight));
    if (height > width) [width, height] = [height, width];
    const scale = Math.min(width / 16, height / 9);
    return {width: Math.floor(scale * 16), height: Math.floor(scale * 9)};
}
const initialGameSize = clawMeasureViewport();
document.documentElement.style.setProperty('--game-width', initialGameSize.width + 'px');
document.documentElement.style.setProperty('--game-height', initialGameSize.height + 'px');
var Module = {
    clawAssetBaseURL: globalThis.CLAW_ASSET_BASE_URL || '/assets/',
    canvas: document.getElementById('canvas'),
    clawViewport: initialGameSize,
    setStatus: function (text) {
        // Emscripten clears its loading status after onRuntimeInitialized.
        // Keep the application status until the game explicitly replaces it.
        if (!text && Module.clawPhase !== 'running') return;
        Module.clawLastStatus = text;
        Module.clawDrawStatus();
    },
    clawDrawStatus: function () {
        // Keep the 2D boot renderer separate from SDL's WebGL context.
        const canvas = document.getElementById('loading');
        const text = Module.clawLastStatus || '';
        canvas.hidden = !text;
        canvas.setAttribute('aria-label', text);
        Module.canvas.style.cursor = Module.clawPhase === 'ready' ? 'pointer' : 'default';
        const viewport = Module.clawViewport;
        if (canvas.width !== viewport.width) canvas.width = viewport.width;
        if (canvas.height !== viewport.height) canvas.height = viewport.height;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, viewport.width, viewport.height);
        if (!text) return;
        const running = Module.clawPhase === 'running';
        ctx.fillStyle = running ? 'rgba(0,0,0,0.85)' : '#000';
        ctx.fillRect(0, running ? viewport.height * 0.78 : 0, viewport.width, running ? viewport.height * 0.22 : viewport.height);
        ctx.fillStyle = '#eeb94e';
        ctx.textAlign = 'center';
        ctx.font = '24px Georgia, serif';
        const lines = [];
        let line = '';
        for (const word of text.split(/\s+/)) {
            const candidate = line ? line + ' ' + word : word;
            if (ctx.measureText(candidate).width > viewport.width * 0.88 && line) {
                lines.push(line); line = word;
            } else line = candidate;
        }
        if (line) lines.push(line);
        // Bound long diagnostics to the canvas; complete details remain in the console.
        const visible = lines.slice(0, running ? 3 : 12);
        if (lines.length > visible.length) visible[visible.length - 1] += '…';
        const percent = text.match(/(\d+(?:\.\d+)?)%/);
        const center = running ? viewport.height * 0.89 : viewport.height / 2;
        const lineHeight = 32 * (viewport.width / 960);
        const firstLineY = center - ((visible.length - 1) * lineHeight) / 2;
        if (percent && !running) {
            const barWidth = Math.min(420 * (viewport.width / 960), viewport.width * 0.72);
            const barHeight = Math.max(3, 4 * (viewport.width / 960));
            const barX = (viewport.width - barWidth) / 2;
            const barY = firstLineY + Math.max(12 * (viewport.width / 960), lineHeight * 0.42);
            ctx.fillStyle = '#302819';
            ctx.fillRect(barX, barY, barWidth, barHeight);
            ctx.fillStyle = '#eeb94e';
            ctx.fillRect(barX, barY, barWidth * Math.min(100, Number(percent[1])) / 100, barHeight);
        }
        visible.forEach((line, i) => ctx.fillText(line, viewport.width / 2,
            center + (i - (visible.length - 1) / 2) * lineHeight, viewport.width * 0.88));
    },
    noInitialRun: true,
    onRuntimeInitialized: function () {
        Module.clawPhase = 'ready';
        Module.setStatus('Gotowe. Kliknij, aby uruchomić.');
    },
    clawStart: function () {
            if (Module.clawPhase !== 'ready') return;
            Module.clawPhase = 'starting';
            Module.canvas.focus();
            Module.setStatus('Uruchamianie gry…');
            try {
                const args = Module.clawComparisonArguments ? Module.clawComparisonArguments() : [];
                let code;
                try { code = Module.callMain(args); }
                finally { if (Module.clawComparisonClearToken) Module.clawComparisonClearToken(); }
                if (code && Module.clawPhase !== 'failed')
                    Module.clawFail('Gra zakończyła uruchamianie z kodem ' + code);
            } catch (error) {
                Module.clawFail(error.stack || String(error));
            }
    },
    clawFail: function (error) {
        Module.clawPhase = 'failed';
        Module.setStatus('Błąd gry: ' + error);
        console.error(error);
    },
    clawStarted: function () {
        Module.clawPhase = 'running';
        Module.setStatus('');
    },
    printErr: function (text) {
        if (text.includes('[info]')) console.info(text);
        else if (text.includes('[warning]')) console.warn(text);
        else console.error(text);
        if (Module.clawPhase === 'starting') {
            // Keep the first specific failure, not a later cleanup message.
            if (!Module.clawStartupError && text.includes('[error]')) Module.clawStartupError = text;
            Module.setStatus('Uruchamianie gry: ' + text);
        }
    },
    onAbort: function (error) { Module.clawFail(error); }
};
window.addEventListener('resize', function () {
    clearTimeout(Module.clawResizeTimer);
    Module.clawResizeTimer = setTimeout(function () {
        const size = clawMeasureViewport();
        document.documentElement.style.setProperty('--game-width', size.width + 'px');
        document.documentElement.style.setProperty('--game-height', size.height + 'px');
        // Preserve SDL's backing resolution; CSS scales the rendered frame
        // without desynchronizing the renderer's internal targets.
    }, 400);
});
Module.canvas.addEventListener('click', () => Module.clawStart());
Module.canvas.addEventListener('keydown', event => {
    if (Module.clawPhase === 'ready' && (event.key === 'Enter' || event.key === ' ')) {
        event.preventDefault();
        Module.clawStart();
    }
});
Module.setStatus('Pobieranie gry…');
window.addEventListener('error', event => Module.clawFail(event.error?.stack || event.message));
window.addEventListener('unhandledrejection', event => Module.clawFail(event.reason));
console.info('Claw Web', {browser:navigator.userAgent, language:navigator.language,
    cores:navigator.hardwareConcurrency, memoryGiB:navigator.deviceMemory,
    screen:[screen.width,screen.height], viewport:[innerWidth,innerHeight],
    pixelRatio:devicePixelRatio});
</script>
<script async type="text/javascript" src="Claw2.js"></script>
</html>
