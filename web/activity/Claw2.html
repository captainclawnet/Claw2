html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:#eee;font:16px system-ui;text-align:center}
body.touch-controls-visible,#canvas.touch-controls-visible{cursor:none!important}
#game{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden}
canvas{display:block;outline:none;background:#000}
#canvas,#loading,#asset-progress{position:absolute;left:50%;top:50%;width:var(--game-view-width,100vw)!important;height:var(--game-view-height,100dvh)!important;transform:translate(-50%,-50%)}
#loading{pointer-events:none;background:#000;opacity:0;transition:opacity 350ms ease}
#asset-progress{z-index:2;pointer-events:none;background:transparent}
#asset-progress[hidden]{display:none}
html.claw-rotated #game{position:fixed;inset:0;width:100vw;height:100dvh;display:block;transform:none}
html.claw-rotated #canvas,html.claw-rotated #loading,html.claw-rotated #asset-progress{width:var(--game-view-width,100dvh)!important;height:var(--game-view-height,100vw)!important;transform:translate(-50%,-50%) rotate(90deg)}
#loading[hidden]{display:none}
#touch-controls[hidden]{display:none}
#touch-controls{position:fixed;inset:0;pointer-events:none;z-index:10;user-select:none;-webkit-user-select:none}
.touch-pad,.touch-actions,.touch-menu{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));pointer-events:auto;touch-action:none}
.touch-pad[hidden],.touch-actions button[hidden]{display:none}
.touch-pad{left:max(16px,env(safe-area-inset-left));display:grid;grid-template-columns:repeat(3,clamp(36px,9vw,60px));grid-template-rows:repeat(3,clamp(36px,9vw,60px));grid-template-areas:". up ." "left . right" ". down ."}
.touch-actions{right:max(16px,env(safe-area-inset-right));display:grid;grid-template-columns:repeat(2,auto);gap:8px}
.touch-menu{top:max(16px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));bottom:auto}
#touch-controls button{margin:0;padding:0;width:clamp(36px,9vw,60px);height:clamp(36px,9vw,60px);border:1px solid #ffffff80;border-radius:12px;background:#172536aa;color:white;font:bold 14px system-ui;touch-action:none}
#touch-controls .touch-actions button{width:clamp(54px,12vw,80px);height:clamp(54px,12vw,80px);border-radius:50%;font-size:12px}
#touch-controls button.active{background:#d09535dd;border-color:#ffe1a3}
.touch-pad span{pointer-events:none}
html.claw-rotated #touch-controls{inset:auto;width:100dvh;height:100vw;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg)}
html.claw-rotated .touch-pad,html.claw-rotated .touch-actions,html.claw-rotated .touch-menu{position:absolute}
html.claw-rotated .touch-pad,html.claw-rotated .touch-actions{bottom:max(16px,env(safe-area-inset-bottom));top:auto}
html.claw-rotated .touch-menu{top:max(16px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left))}
html.claw-rotated .touch-pad{left:max(16px,env(safe-area-inset-left))}
html.claw-rotated .touch-actions{right:max(16px,env(safe-area-inset-right))}
#touch-controls button[hidden]{display:none}
#touch-controls .touch-stick{position:absolute;left:20px;bottom:20px;width:150px;height:150px;border-radius:50%;font-size:48px;pointer-events:auto;touch-action:none;background:radial-gradient(circle,#ffffff60 0 22%,#172536aa 24%)}
#touch-controls .touch-keyboard{position:absolute;top:max(16px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right));pointer-events:auto;font-size:26px}
#touch-controls .touch-menu button{font-size:26px}
.touch-text-input{position:absolute;top:0;left:50%;width:1px;height:1px;padding:0;border:0;opacity:0;pointer-events:none;font-size:16px}
#leaderboard-dialog{box-sizing:border-box;width:min(1440px,calc(100vw - 28px));height:min(920px,calc(100dvh - 28px));max-width:none;max-height:none;margin:auto;padding:clamp(16px,2.4vw,32px);border:1px solid #b88943;border-radius:16px;background:linear-gradient(145deg,#172333,#0b111a 72%);color:#eee;text-align:left;font:16px system-ui;overflow:hidden}
#leaderboard-dialog::backdrop{background:#000d;backdrop-filter:blur(4px)}
#leaderboard-layout{height:100%;display:flex;flex-direction:column;min-height:0}
#leaderboard-header{display:flex;align-items:center;justify-content:space-between;gap:12px}
#leaderboard-title{margin:0;color:#ffe1a3;font-size:clamp(24px,3vw,38px);letter-spacing:.04em}
#leaderboard-close{width:44px;height:44px;border:1px solid #ffffff50;border-radius:10px;background:#172536;color:white;font-size:24px;cursor:pointer}
#leaderboard-filters{display:flex;align-items:end;justify-content:flex-start;flex-wrap:wrap;gap:12px;margin:22px 0 16px}
#leaderboard-filters label{display:grid;gap:6px;color:#aab8c7;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
#leaderboard-filters select{min-width:150px;padding:10px 36px 10px 12px;border:1px solid #526274;border-radius:8px;background:#1a293a;color:#fff;font:600 14px system-ui}
#leaderboard-level-label[hidden],#leaderboard-level[hidden]{display:none}
#leaderboard-status{min-height:1.4em;margin:0 0 10px;color:#e3c88e}
#leaderboard-dialog[data-state="empty"] #leaderboard-columns,#leaderboard-dialog[data-state="error"] #leaderboard-columns,#leaderboard-dialog[data-state="empty"] #leaderboard-entries,#leaderboard-dialog[data-state="error"] #leaderboard-entries{display:none}
#leaderboard-dialog[data-state="empty"] #leaderboard-status,#leaderboard-dialog[data-state="error"] #leaderboard-status{display:grid;flex:1;place-items:center;margin:16px 4px;border:1px solid #ffffff18;border-radius:12px;background:#ffffff06;font-size:clamp(18px,2.4vw,25px);text-align:center}
#leaderboard-columns,#leaderboard-entries li{display:grid;grid-template-columns:44px minmax(130px,1.6fr) minmax(100px,.8fr) minmax(100px,.8fr);column-gap:16px;align-items:center}
#leaderboard-columns{padding:10px 18px;color:#9eafbf;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
#leaderboard-columns .active{color:#f2d394}
#leaderboard-entries{flex:1;min-height:0;overflow:auto;margin:0;padding:0 4px 4px;list-style:none;scrollbar-color:#82663b #111a24}
#leaderboard-entries li{position:relative;min-height:70px;margin:0 0 8px;padding:12px 18px;border:1px solid #ffffff12;border-radius:10px;background:#ffffff08}
#leaderboard-entries li:nth-child(even){background:#ffffff04}
.leaderboard-rank{color:#e6c27b;font-weight:700}
.leaderboard-player{overflow:hidden;color:#f5f2ea;text-overflow:ellipsis;white-space:nowrap}
.leaderboard-score,.leaderboard-time{font-variant-numeric:tabular-nums}
.leaderboard-secondary{grid-column:2/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:7px;color:#aab7c4;font-size:12px;line-height:1.5}
.leaderboard-details{flex:none;color:#d4bd90;font-size:12px}
.leaderboard-details summary{width:max-content;cursor:pointer}
.leaderboard-details small{display:block;margin-top:6px;color:#aab7c4;line-height:1.6}
.leaderboard-skeleton{min-height:32px!important;margin-bottom:5px!important;padding:7px 18px!important;overflow:hidden}
.leaderboard-skeleton-block{height:12px;border-radius:5px;background:linear-gradient(90deg,#263546 20%,#3b4a5a 38%,#263546 58%);background-size:220% 100%;animation:leaderboard-shimmer 1.25s linear infinite}
.leaderboard-skeleton-block.rank{width:20px}
.leaderboard-skeleton-block.player{width:min(65%,280px)}
.leaderboard-skeleton-block.metric{width:72px}
.leaderboard-skeleton-block.secondary{grid-column:2/-1;width:min(80%,520px);height:8px;margin-top:0}
@keyframes leaderboard-shimmer{to{background-position-x:-220%}}
@media(max-width:620px){#leaderboard-dialog{width:calc(100vw - 12px);height:calc(100dvh - 12px);padding:14px;border-radius:12px}#leaderboard-filters{gap:8px;margin:14px 0 10px}#leaderboard-filters label{flex:1;min-width:100px}#leaderboard-filters select{box-sizing:border-box;min-width:0;width:100%;padding:9px 5px;font-size:12px}#leaderboard-columns,#leaderboard-entries li{grid-template-columns:28px minmax(70px,1.2fr) minmax(64px,.8fr) minmax(64px,.8fr);column-gap:8px}#leaderboard-columns{padding:8px 10px;font-size:10px}#leaderboard-entries li{padding:10px;min-height:64px;font-size:13px}.leaderboard-secondary,.leaderboard-details{font-size:10px}.leaderboard-secondary{align-items:flex-start;flex-wrap:wrap}}
#loading-error[hidden]{display:none}
#loading-error{position:fixed;z-index:20;left:4vw;top:6vh;width:min(78vw,760px);max-height:82vh;box-sizing:border-box;padding:18px;border:1px solid #aaa;background:#000;color:#fff;text-align:left;font:16px Arial,sans-serif}
#loading-error-title{margin:0 0 10px;font: bold 20px Arial,sans-serif}
#loading-error-text{display:block;width:100%;height:min(38vh,260px);box-sizing:border-box;resize:vertical;padding:10px;border:1px solid #888;background:#090909;color:#fff;font:14px/1.45 Arial,sans-serif;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
#loading-error-actions{display:flex;gap:10px;margin-top:10px}
#loading-error-actions button{padding:8px 14px;border:1px solid #aaa;background:#222;color:#fff;font:14px Arial,sans-serif;cursor:pointer}

    const frames = new Map(atlas.frames.map(frame => [Number(frame.filename.slice(5)), frame]));

    let animationStarted = 0;

        const rect = frame.frame;
        const offsetX = step.positionOperation === 1 ? step.offsetX : 0;

            x: Math.floor(rect.w / 2) - frame.offset.x - offsetX,
