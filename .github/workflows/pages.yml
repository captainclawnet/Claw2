name: Deploy web game and release asset cache
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [assets-published]
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build verified asset cache from Releases
        id: cache
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/CacheWebAssets.py --web web --output _site --check-url https://captainclawnet.github.io/Claw2/release-index.json
      - uses: actions/configure-pages@v5
        if: steps.cache.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.cache.outputs.changed == 'true'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.cache.outputs.changed == 'true'
        id: deploy
